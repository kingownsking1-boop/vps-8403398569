name: Kali-VPS
on:
  workflow_dispatch:
    inputs:
      ts_authkey: { required: true }
      telegram_chat_id: { required: false }
      bot_token: { required: false }
permissions: { contents: read, actions: write }
jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: kalilinux/kali-rolling
      options: --cap-add=NET_ADMIN --device /dev/net/tun
    steps:
      - name: Install Kali Tools & SSH
        run: |
          apt-get update
          apt-get install -y openssh-server sudo curl wget nano vim fastfetch iproute2 kali-desktop-xfce
          curl -fsSL https://tailscale.com/install.sh | sh
      
      - name: Setup SSH & User
        run: |
          userdel -r admin 2>/dev/null || true
          groupdel admin 2>/dev/null || true
          useradd -m -s /bin/bash -U admin
          echo 'admin:Pass@2026' | chpasswd
          usermod -aG sudo admin
          mkdir -p /run/sshd
          sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          /usr/sbin/sshd
          
          echo 'export HOME=/home/admin' >> /home/admin/.bashrc
          echo 'export PS1="\[\e[1;31m\]┌──(\[\e[1;34m\]admin㉿kali\[\e[1;31m\])-[\[\e[0m\]\w\[\e[1;31m\]]\n\[\e[1;31m\]└─\[\e[1;34m\]\$ \[\e[0m\]"' >> /home/admin/.bashrc
          chown admin:admin /home/admin/.bashrc
      
      
      - name: Setup VNC GUI
        run: |
          apt-get install -y xfce4 xfce4-goodies xfce4-session tightvncserver dbus-x11
          su - admin -c "mkdir -p /home/admin/.vnc"
          echo 'Pass@2026' | su - admin -c "vncpasswd -f > /home/admin/.vnc/passwd"
          chmod 600 /home/admin/.vnc/passwd
          su - admin -c "echo '#!/bin/sh' > /home/admin/.vnc/xstartup"
          su - admin -c "echo 'unset SESSION_MANAGER' >> /home/admin/.vnc/xstartup"
          su - admin -c "echo 'unset DBUS_SESSION_BUS_ADDRESS' >> /home/admin/.vnc/xstartup"
          su - admin -c "echo 'export XDG_CURRENT_DESKTOP=XFCE' >> /home/admin/.vnc/xstartup"
          su - admin -c "echo 'export XDG_CONFIG_DIRS=/etc/xdg:/etc/xdg/user-dirs' >> /home/admin/.vnc/xstartup"
          su - admin -c "echo 'exec dbus-launch --exit-with-session startxfce4' >> /home/admin/.vnc/xstartup"
          chmod +x /home/admin/.vnc/xstartup
          chown -R admin:admin /home/admin/.vnc
          su - admin -c "vncserver :1 -geometry 1280x720 -depth 24 -localhost -extension GLX"

      
      - name: Connect Tailscale
        run: |
          mkdir -p /var/lib/tailscale /var/run/tailscale
          tailscaled > /tmp/tailscaled.log 2>&1 &
          sleep 5
          tailscale up --authkey "${{ inputs.ts_authkey }}" --hostname "kali-vps"
          IP=$(tailscale ip -4 | head -n 1)
          echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV
      
      - name: Send Telegram Credentials
        if: always()
        run: |
          CHAT_ID="${{ inputs.telegram_chat_id }}"; BOT="${{ inputs.bot_token }}"
          IP="${{ env.TAILSCALE_IP }}"
          TEXT="✅ Real Kali Ready! IP: $IP | User: admin | Pass: Pass@2026 | Mode: GUI"
          curl -s -X POST "https://api.telegram.org/bot$BOT/sendMessage" -d "chat_id=$CHAT_ID" -d "text=$TEXT" > /dev/null
      
      - name: Keep Alive
        run: while true; do echo "Active"; sleep 300; done
